<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Редактор данных сайта</title><style>
body{font-family:Inter,system-ui,sans-serif;margin:0;background:#f5f7fa;color:#101828}.wrap{max-width:1000px;margin:auto;padding:28px 16px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:20px}textarea{width:100%;min-height:560px;border:1px solid #d0d5dd;border-radius:12px;padding:14px;font:13px ui-monospace,monospace;box-sizing:border-box}button{margin-top:12px;border:0;border-radius:10px;padding:12px 16px;background:#155eef;color:#fff;font-weight:800;cursor:pointer}.note{color:#667085;line-height:1.6;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap}.secondary{background:#344054}
</style></head><body><div class="wrap"><div class="card"><h1>Редактор данных</h1><p class="note">Это безопасный статический редактор: он не меняет опубликованный сайт сам. Измени JSON, скачай новый <b>data.js</b> и замени файл в проекте перед публикацией на Vercel.</p><textarea id="editor"></textarea><div class="row"><button onclick="downloadData()">Скачать data.js</button><button class="secondary" onclick="location.href='../'">На сайт</button></div></div></div><script src="../data.js"></script><script>
const e=document.getElementById('editor');e.value=JSON.stringify(SITE_DATA,null,2);
function downloadData(){try{const obj=JSON.parse(e.value);const blob=new Blob(['window.SITE_DATA = '+JSON.stringify(obj,null,2)+';'],{type:'text/javascript;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='data.js';a.click();URL.revokeObjectURL(a.href);}catch(err){alert('Ошибка JSON: '+err.message)}}
</script></body></html>
